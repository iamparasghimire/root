<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .navbar {
      background-color: #333;
      color: #fff;
      padding: 10px;
      text-align: center;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
    }

    .form-container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 80%; /* Use a larger width for larger screens */
      max-width: 400px; /* Set a maximum width for small screens */
      margin: auto; /* Center the form container horizontally */
      box-sizing: border-box;
    }

    .form-container label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-container input,
    .form-container textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-container button {
      background-color: #4caf50;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    .form-container button:hover {
      background-color: #45a049;
    }

    .footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
    }

    /* Media queries for responsiveness */
    @media only screen and (max-width: 600px) {
      .form-container {
        width: 90%; /* Adjust width for small screens */
      }
    }
  </style>
</head>
<body>

<div class="navbar">
  <h2>Dashboard</h2>
</div>

<div class="dashboard">
  <div class="form-container">
    <h2 style="color:red;text-align:center;">Predict Possible Crime </h2>

    <form method="post" action="{% url 'index' %}">
        {% csrf_token %}
        {{ form }}
      <button type="submit">Submit</button>
    </form>
    <h3 style="text-align:center;">Your Output Content Goes Here</h3>
  </div>
</div>


<div class="footer">
  <p>&copy; Crime rate prediction</p>
</div>

</body>
</html>
